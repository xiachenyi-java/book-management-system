# 数据库连接地址
spring.datasource.url=jdbc:mysql://localhost:3306/book_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# 数据库用户名
spring.datasource.username=root

# 数据库密码（改成你自己的）
spring.datasource.password=123456

# 自动建表：update 表示程序启动时自动更新表结构
spring.jpa.hibernate.ddl-auto=update

# 在控制台打印 SQL 语句（方便学习）
spring.jpa.show-sql=true

#日志配置
logging.level.com.example2.demo2=INFO
logging.file.name=logs/book-manager.log

#连接redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 单个文件最大 10MB（写成 10MB 或 10485760 字节均可）
spring.servlet.multipart.max-file-size=10MB
# 整个请求最大 10MB（如果只传 1 个文件，通常和上面保持一致）
spring.servlet.multipart.max-request-size=10MB

#接口文档开启
knife4j.enable=true
