services:
  mysql:
    image: mysql:8.0
    container_name: demo2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: book_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: demo2-app
    ports:
      - "8081:80"  # 宿主机8081映射到容器80（因为prod里server.port=80）
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-signing-must-be-long
      - DB_URL=jdbc:mysql://mysql:3306/book_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_PASSWORD=123456
    depends_on:
      - mysql

volumes:
  mysql_data: